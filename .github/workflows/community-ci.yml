name: Community CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test worker using synthetic requests
        run: node --test cloudflare/mickofy-writing-assistant/worker.test.mjs

  electron-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Install GUI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64
      - name: Run synthetic desktop tests
        run: xvfb-run -a npm test

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Run non-GUI unit tests
        run: node --test tests/paste-session.test.cjs
      - name: Package unsigned Windows installer
        run: npm run build -- --publish never
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Clarity-AI-Assistant-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
